stages:
  data_ingestion:
    cmd: python src/ingest.py
    deps:
      - src/ingest.py
      - data/raw
    outs:
      - data/processed/ingested_data.csv
  preprocessing:
    cmd: python src/preprocess.py
    deps:
      - src/preprocess.py
      - data/processed/ingested_data.csv
    outs:
      - data/processed/features.csv
  training:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/features.csv
    outs:
      - models/model.pkl
  evaluation:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.pkl
      - data/processed/features.csv
    metrics:
      - metrics.json:
          cache: false
