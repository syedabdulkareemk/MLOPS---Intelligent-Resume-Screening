stages:
  prepare_data:
    cmd: python scripts/prepare_data.py
    deps:
      - data/source/onet_subset_v31.csv
    outs:
      - data/training/prepared_v1.csv

  validate_data:
    cmd: python scripts/validate_data.py
    deps:
      - data/training/prepared_v1.csv

  preprocess:
    cmd: python scripts/preprocess.py
    deps:
      - data/training/prepared_v1.csv
    outs:
      - data/training/preprocessed_v1.csv

  build_features:
    cmd: python scripts/build_features.py
    deps:
      - data/training/preprocessed_v1.csv
    outs:
      - data/training/features_v1.csv

  train:
    cmd: python scripts/train.py
    deps:
      - data/training/features_v1.csv
      - ml/monitoring/pipeline.py
    outs:
      - models/talentlens_ranker_v1.pkl

  evaluate:
    cmd: python scripts/evaluate.py
    deps:
      - models/talentlens_ranker_v1.pkl
      - data/training/features_v1.csv
    metrics:
      - metrics.json:
          cache: false
